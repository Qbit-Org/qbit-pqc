name: Publish

# Publishes @qbit-oss/pqc to npm when a release tag is pushed. "Publishing" in
# RELEASING.md describes the jobs, the first publish and how a publish is
# approved.
#
# Three jobs, so that only code the lockfile pins can shape what is
# published, and nothing that runs third-party code can publish. `build` runs
# only the locked dev dependencies and the package's prepack, packs the
# tarball, and reports its SHA-256 sum and the artifact's ID. `smoke` runs the
# checks that build does not need: the comparison of the vendored C sources
# with a fetch of the pinned upstream commit, the reproducible WASM rebuild in
# the pinned emsdk Docker image, and the fresh-consumer smoke. Neither job
# holds a secret or an id-token. `publish` holds both, but checks out nothing,
# installs nothing and runs no lifecycle script: it downloads build's artifact
# by ID and publishes the tarball only if it matches build's sum.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# An explicit shell makes every run block bash -eo pipefail, not bash -e.
defaults:
  run:
    shell: bash

jobs:
  build:
    # Only Qbit-Org/qbit-pqc publishes: npm provenance ties every version to
    # the repository in package.json `repository.url`, and forks must never
    # publish.
    if: github.repository == 'Qbit-Org/qbit-pqc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      # Full history, so the release-branch check below can see release/X.Y.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # No `version:` input: the action installs the pnpm version that
      # package.json `packageManager` names, as in CI. The check below makes
      # sure it did.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      # No `cache:`: a release build must not restore a cache that other
      # workflow runs write.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check pnpm matches packageManager
        run: |
          expected="$(node -p "require('./package.json').packageManager.split('+')[0].slice('pnpm@'.length)")"
          actual="$(pnpm --version)"
          echo "packageManager pnpm $expected, running pnpm $actual"
          test "$actual" = "$expected"

      # The tag must name the package.json version, CHANGELOG.md must have
      # its section, and the tagged commit must be on that version's release
      # branch. distTagForVersion accepts only X.Y.Z (latest) and X.Y.Z-rc.N
      # (candidate), and never 0.0.0. Runs before the dependencies are
      # installed: scripts/check-publish.mjs imports only Node.js built-ins
      # and scripts/pack-policy.mjs.
      - name: Check the tag against package.json, CHANGELOG.md and the release branch
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the package.json version $version (expected v$version)"
            exit 1
          fi
          if ! dist_tag="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; import { distTagForVersion } from './scripts/check-publish.mjs'; console.log(distTagForVersion(JSON.parse(readFileSync('package.json', 'utf8')).version))")"; then
            echo "::error::version $version is not X.Y.Z or X.Y.Z-rc.N, or is 0.0.0"
            exit 1
          fi
          if ! awk -v heading="## $version" '$0 == heading || index($0, heading " ") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          branch="release/$(cut -d. -f1,2 <<<"$version")"
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$branch"; then
            echo "::error::$TAG is not on $branch; release tags are cut only on release branches"
            exit 1
          fi
          echo "Publishing $version from $branch with dist-tag $dist_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # engine-strict: Node.js 24 must satisfy every engines range.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify checked-in WASM hashes
        run: pnpm check:wasm

      - name: Check npm package contents
        run: pnpm pack:check

      # The guard npm runs as prepublishOnly, which publishing a tarball does
      # not run: it refuses package files that differ from the tagged commit,
      # a version that is not a release version, and WASM that fails
      # check:wasm. With CI=true it leaves check:wasm:repro to smoke.
      - name: Check the package files and version for publishing
        run: node scripts/check-publish.mjs

      # npm pack runs the package's prepack (pnpm build). This tarball is
      # exactly what the publish job publishes, and its sum is recorded in the
      # same step, before any other code runs.
      - name: Pack the tarball to publish
        id: pack
        run: |
          mkdir "$RUNNER_TEMP/tarballs"
          npm pack --pack-destination "$RUNNER_TEMP/tarballs"
          cd "$RUNNER_TEMP/tarballs" || exit
          { echo 'sha256<<EOF'; sha256sum -- *.tgz; echo EOF; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error

  # Checks that build does not need in order to pack the tarball, including
  # those that fetch data or run code the lockfile does not pin. They run
  # here, not in build, so that their code cannot touch the tarball before
  # build records its sum, and publish takes build's artifact by ID and checks
  # that sum. This job can stop a release, but not change what is published.
  smoke:
    needs: build
    if: github.repository == 'Qbit-Org/qbit-pqc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      # As in CI. MANIFEST alone would accept an edited vendored file whose
      # MANIFEST line was rewritten to match, so also compare it with the
      # pinned upstream tree. The fetch is data addressed by the pinned commit
      # SHA and only compared by this repository's own script; no downloaded
      # code runs.
      - name: Verify vendored C sources against MANIFEST and upstream
        run: |
          pin=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; import { parseUpstreamPin } from './scripts/check-vendor.mjs'; console.log(parseUpstreamPin(readFileSync('vendor/libbitcoinpqc-qbit/UPSTREAM.md', 'utf8')))")
          upstream="$RUNNER_TEMP/qbit-libbitcoinpqc"
          git init -q "$upstream"
          for attempt in 1 2 3; do
            git -C "$upstream" fetch -q --depth=1 https://github.com/Qbit-Org/qbit-libbitcoinpqc.git "$pin" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          pnpm check:vendor --upstream "$upstream"

      # Rebuilds pqc.mjs and pqc.wasm in the emsdk Docker image that
      # scripts/build-wasm.sh pins by digest, and fails unless they match the
      # checked-in files.
      - name: Verify reproducible WASM rebuild
        run: pnpm check:wasm:repro

      # Packs its own copy of the package from the tagged commit, installs it
      # in a throwaway project and runs it there.
      - name: Fresh-consumer install smoke
        run: pnpm smoke:consumer

  publish:
    needs: [build, smoke]
    if: github.repository == 'Qbit-Org/qbit-pqc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the NPM_TOKEN bootstrap secret, only for the first publish, and
    # the required reviewers; the package's npm trusted publisher is bound to
    # this environment.
    environment: npm
    permissions:
      contents: read
      # OIDC token for npm trusted publishing and the provenance signature.
      id-token: write
    env:
      PACKAGE: '@qbit-oss/pqc'

    steps:
      # By ID, not name: an artifact re-uploaded under the same name gets a
      # new ID.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/tarballs

      # Everything from build is checked before anything else runs: the
      # version must be a release version and the tag's, the dist-tag the one
      # that version implies, the artifact exactly the tarball of that
      # version, and the tarball byte for byte the one whose SHA-256 build
      # recorded. The version rule is distTagForVersion's, which this job
      # cannot import.
      - name: Check the tarball against the tag and build's SHA-256 sum
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          number='(0|[1-9][0-9]*)'
          expected_dist_tag=
          if [[ "$VERSION" =~ ^$number\.$number\.$number$ ]]; then
            expected_dist_tag=latest
          elif [[ "$VERSION" =~ ^$number\.$number\.$number-rc\.$number$ ]]; then
            expected_dist_tag=candidate
          fi
          if [ -z "$expected_dist_tag" ] || [[ "$VERSION" == 0.0.0* ]] ||
             [ "$TAG" != "v$VERSION" ] || [ "$DIST_TAG" != "$expected_dist_tag" ]; then
            echo "::error::build reported version '$VERSION' with dist-tag '$DIST_TAG' for tag $TAG"
            exit 1
          fi
          tarballs="$RUNNER_TEMP/tarballs"
          # npm pack names @scope/name@version scope-name-version.tgz.
          expected="$(tr / - <<<"${PACKAGE#@}")-$VERSION.tgz"
          actual="$(find "$tarballs" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the npm-tarball artifact holds [${actual//$'\n'/ }], expected [$expected]"
            exit 1
          fi
          # One `<sha256>  <file>` line, for that tarball, and nothing else.
          if grep -Evq '^[0-9a-f]{64}  [^[:space:]]+$' <<<"$SHA256" ||
             [ "$(cut -c 67- <<<"$SHA256")" != "$expected" ]; then
            echo "::error::build's SHA-256 sums [${SHA256//$'\n'/ }] do not list exactly [$expected]"
            exit 1
          fi
          cd "$tarballs" || exit
          printf '%s\n' "$SHA256" | sha256sum --check --strict -

      # Node.js 24 bundles an npm with trusted publishing.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check Node.js and npm versions
        run: |
          # npm trusted publishing needs npm >= 11.5.1 on Node.js >= 22.14.0.
          at_least() { [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]; }
          node_version="$(node -p process.versions.node)"
          npm_version="$(npm --version)"
          echo "Node.js $node_version, npm $npm_version"
          if ! at_least "$node_version" 22.14.0 || ! at_least "$npm_version" 11.5.1; then
            echo "::error::npm trusted publishing needs Node.js >= 22.14.0 and npm >= 11.5.1"
            exit 1
          fi

      # npm publish reads the tarball with its own reader (pacote and
      # node-tar), which disagrees with GNU tar on crafted archives, so the
      # tarball's name@version is read with that reader, through
      # `npm pack --dry-run`, and must be this package at the tagged version,
      # with no path listed twice. As an extra layer, every entry GNU tar
      # lists must be under package/, with no empty, `.` or `..` component,
      # and exactly one must be package/package.json.
      - name: Check the tarball's entries and manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          file="$(tr / - <<<"${PACKAGE#@}")-$VERSION.tgz"
          tarball="$RUNNER_TEMP/tarballs/$file"
          entries="$(tar -tzf "$tarball")"
          if ! awk '
              !/^package(\/[^\/]+)+$/ || /\/\.\.?(\/|$)/ { bad = 1 }
              $0 == "package/package.json" { manifests++ }
              END { exit bad || manifests != 1 }' <<<"$entries"; then
            echo "::error::$file must hold only package/ entries with no empty, . or .. component, and exactly one package/package.json"
            exit 1
          fi
          manifest="$(npm pack --dry-run --json --ignore-scripts --offline "$tarball" | node -e '
            const [p] = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const paths = p.files.map(f => f.path)
            if (new Set(paths).size !== paths.length) {
              console.error("::error::duplicate entries: " + paths.join(" "))
              process.exit(1)
            }
            console.log(p.id)')"
          if [ "$manifest" != "$PACKAGE@$VERSION" ]; then
            echo "::error::$file holds $manifest, not $PACKAGE@$VERSION"
            exit 1
          fi
          echo "$file: $manifest"

      # npm authenticates through trusted publishing (OIDC) when the package
      # has a trusted publisher for this workflow, and otherwise falls back to
      # NODE_AUTH_TOKEN. NPM_TOKEN exists only for the first publish, before
      # npm lets a trusted publisher be configured for the package, so the
      # step fails while it is set and the package exists, and also when npm
      # answers anything but E404 for whether it exists. A version already on
      # npm is skipped if npm's integrity for it is this tarball's and fails
      # the job otherwise, so re-running this job finishes a partial publish
      # and never publishes different bytes. If reading that integrity fails,
      # npm publish runs and itself refuses a version that exists. A release
      # candidate goes to `candidate`; a final release gets no --tag, so npm
      # applies `latest`, and the npm client refuses one not above the highest
      # non-deprecated final release it can look up. Publishing a tarball runs
      # no lifecycle script; --ignore-scripts makes that explicit.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            # A token pasted with a newline or space would fail later as an
            # opaque E401.
            if [[ "$NODE_AUTH_TOKEN" =~ [[:space:]] ]]; then
              echo "::error::NPM_TOKEN contains whitespace"
              exit 1
            fi
            if view_err="$(npm view "$PACKAGE" name 2>&1 >/dev/null)"; then
              echo "::error::NPM_TOKEN is set but $PACKAGE already exists on npm. Delete the secret, revoke the token, and publish through the trusted publisher (RELEASING.md)."
              exit 1
            fi
            if ! grep -qx 'npm error code E404' <<<"$view_err"; then
              echo "::error::cannot tell whether $PACKAGE exists on npm: ${view_err//$'\n'/ }"
              exit 1
            fi
            echo "::warning::NPM_TOKEN is set. Delete it and revoke the token once $PACKAGE has a trusted publisher (RELEASING.md)."
          fi
          tarball="$RUNNER_TEMP/tarballs/$(tr / - <<<"${PACKAGE#@}")-$VERSION.tgz"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          published="$(npm view "$PACKAGE@$VERSION" dist.integrity 2>/dev/null || true)"
          if [ -n "$published" ]; then
            if [ "$published" != "$integrity" ]; then
              echo "::error::$PACKAGE@$VERSION is already on npm with integrity $published, but this tarball's is $integrity"
              exit 1
            fi
            echo "$PACKAGE@$VERSION is already on npm with this tarball's integrity; skipping"
            exit 0
          fi
          tag_args=()
          if [ "$DIST_TAG" = candidate ]; then
            tag_args=(--tag candidate)
          fi
          npm publish "$tarball" --provenance --access public "${tag_args[@]}" --ignore-scripts
